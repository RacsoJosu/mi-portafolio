<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="eventGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f1624" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)" />

  <!-- Subtle Blueprint Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
  </pattern>
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Ambient Glow Behind Broker -->
  <circle cx="400" cy="240" r="140" fill="#6366f1" fill-opacity="0.12" filter="url(#neon)" />
  <circle cx="160" cy="240" r="90" fill="#0284c7" fill-opacity="0.08" filter="url(#neon)" />
  <circle cx="650" cy="240" r="110" fill="#10b981" fill-opacity="0.08" filter="url(#neon)" />

  <!-- Title & CDK Badge Header -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="108" height="26" rx="13" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1" />
    <text x="54" y="17" fill="#ff9900" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AWS CDK v2</text>
    
    <text x="122" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Event-Driven Architecture (Python)</text>
    <text x="720" y="18" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">LocalStack Ready</text>
  </g>

  <!-- Connection Lines (SVG Paths) -->
  <!-- Line 1: Producer to EventBridge -->
  <path d="M 240 240 L 330 240" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="285" cy="240" r="4" fill="#38bdf8" />

  <!-- Lines from EventBridge to Consumers -->
  <path d="M 470 210 Q 520 190 560 140 L 570 140" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5,3" />
  <path d="M 470 240 L 570 240" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5,3" />
  <path d="M 470 270 Q 520 290 560 340 L 570 340" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="5,3" />

  <!-- Dead Letter Queue Line (DLQ) -->
  <path d="M 400 310 L 400 375" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" />
  
  <!-- ──────────────── NODE 1: Producer Service ──────────────── -->
  <g transform="translate(60, 160)">
    <rect width="180" height="160" rx="16" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="14" y="14" width="38" height="38" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <!-- API Gateway Icon -->
    <path d="M 25 33 L 33 21 L 41 33 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    <circle cx="33" cy="30" r="2" fill="#38bdf8" />

    <text x="60" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">API Gateway</text>
    <text x="60" y="44" fill="#94a3b8" font-family="monospace" font-size="10">POST /reservas</text>

    <!-- Producer Lambda Pill -->
    <g transform="translate(14, 68)">
      <rect width="152" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">λ create_booking</text>
      <text x="12" y="35" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Python 3.11 Runtime</text>
    </g>

    <text x="90" y="138" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Event Producer</text>
  </g>

  <!-- Floating Event Pill 1 -->
  <g transform="translate(250, 212)">
    <rect width="70" height="22" rx="11" fill="#18181b" stroke="#f59e0b" stroke-width="1" />
    <text x="35" y="15" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">event.put</text>
  </g>

  <!-- ──────────────── NODE 2: Amazon EventBridge Broker ──────────────── -->
  <g transform="translate(330, 150)">
    <rect width="140" height="160" rx="18" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="2" />
    <rect x="0" y="0" width="140" height="160" rx="18" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- EventBridge Hexagon Logo -->
    <g transform="translate(48, 20)">
      <circle cx="22" cy="22" r="22" fill="#7c3aed" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.5" />
      <polygon points="22,12 31,17 31,27 22,32 13,27 13,17" fill="none" stroke="#e9d5ff" stroke-width="2" />
      <circle cx="22" cy="22" r="3" fill="#f43f5e" />
    </g>

    <text x="70" y="86" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EventBridge</text>
    <text x="70" y="102" fill="#c084fc" font-family="monospace" font-size="10.5" font-weight="600" text-anchor="middle">Event Bus</text>

    <!-- Rule Filter Tags -->
    <g transform="translate(16, 116)">
      <rect width="108" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="54" y="16" fill="#a5b4fc" font-family="monospace" font-size="9" text-anchor="middle">Rules &amp; Patterns</text>
    </g>
  </g>

  <!-- ──────────────── DLQ Queue Node ──────────────── -->
  <g transform="translate(340, 375)">
    <rect width="120" height="46" rx="8" fill="#1f1315" stroke="#ef4444" stroke-width="1" />
    <text x="60" y="22" fill="#fca5a5" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">SQS DLQ</text>
    <text x="60" y="36" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dead-Letter Queue</text>
  </g>

  <!-- ──────────────── NODE 3: Consumers (Lambdas) ──────────────── -->
  <!-- Consumer 1: Notifications -->
  <g transform="translate(570, 110)">
    <rect width="170" height="58" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2" />
    <rect x="12" y="12" width="34" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <text x="29" y="33" fill="#34d399" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">λ</text>
    <text x="56" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Notificaciones</text>
    <text x="56" y="42" fill="#6ee7b7" font-family="monospace" font-size="9.5">Email / SES Handler</text>
  </g>

  <!-- Consumer 2: Billing & Invoicing -->
  <g transform="translate(570, 210)">
    <rect width="170" height="58" rx="10" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.2" />
    <rect x="12" y="12" width="34" height="34" rx="6" fill="#164e63" fill-opacity="0.4" stroke="#06b6d4" stroke-width="1" />
    <text x="29" y="33" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">λ</text>
    <text x="56" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Facturación</text>
    <text x="56" y="42" fill="#67e8f9" font-family="monospace" font-size="9.5">Payment Processing</text>
  </g>

  <!-- Consumer 3: Analytics -->
  <g transform="translate(570, 310)">
    <rect width="170" height="58" rx="10" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="12" y="12" width="34" height="34" rx="6" fill="#3b0764" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1" />
    <text x="29" y="33" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">λ</text>
    <text x="56" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Analítica &amp; BI</text>
    <text x="56" y="42" fill="#d8b4fe" font-family="monospace" font-size="9.5">Kinesis / DynamoDB</text>
  </g>

  <!-- Bottom Terminal Tag -->
  <g transform="translate(60, 440)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10.5">cdk synth | cdk deploy --app "python app.py" --require-approval never</text>
  </g>
</svg>
